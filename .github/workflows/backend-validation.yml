name: Backend validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore Compix.Api/Compix.Api.csproj

      - name: Compilar backend
        run: dotnet build Compix.Api/Compix.Api.csproj --configuration Release --no-restore

      - name: Ejecutar pruebas si existen
        shell: bash
        run: |
          mapfile -t test_projects < <(
            find . -type f -name '*Tests.csproj' \
              -not -path '*/bin/*' -not -path '*/obj/*' | sort
          )

          if ((${#test_projects[@]} == 0)); then
            echo "::notice::No se encontraron proyectos *Tests.csproj; no se ejecutaron pruebas."
            exit 0
          fi

          for test_project in "${test_projects[@]}"; do
            dotnet test "$test_project" --configuration Release
          done